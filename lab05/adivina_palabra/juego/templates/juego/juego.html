<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Juego de Ahorcado</title>
  </head>
  <body>
    <h1>Juego de Ahorcado</h1>
    <p>Palabra oculta: {{ palabra_oculta }}</p>
    <p>Intentos restantes: {{ intentos }}</p>

    {% if error %}
    <p style="color: red">{{ error }}</p>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <label for="intento">Ingresa una letra o la palabra completa:</label>
      <input type="text" name="intento" id="intento" maxlength="20" />
      <button type="submit">Intentar</button>
    </form>

    <br />
  </body>
</html>
